<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Email & Content Generator</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts: Outfit for a modern, sleek look -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Boxicons for icons -->
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>
<body>
    <!-- Animated background elements -->
    <div class="bg-orb orb-1"></div>
    <div class="bg-orb orb-2"></div>

    <nav class="navbar">
        <div class="nav-content">
            <div class="logo">
                <div class="logo-icon-wrapper">
                    <i class='bx bx-bot'></i>
                </div>
                <h1>Content<span class="gradient-text">AI</span></h1>
            </div>
            <button id="theme-toggle" class="icon-btn theme-btn" aria-label="Toggle dark mode">
                <i class='bx bx-moon'></i>
            </button>
        </div>
    </nav>

    <main class="container">
        <div class="header-text slide-up">
            <h2 class="title-main">Supercharge your writing with AI</h2>
            <p class="subtitle">Generate professional, engaging content in seconds.</p>
        </div>

        <div class="grid-layout fade-in">
            <!-- Input Section -->
            <section class="glass-card input-section">
                <div class="card-header">
                    <i class='bx bx-edit-alt'></i>
                    <h3>Create Content</h3>
                </div>
                
                <div class="form-group">
                    <label for="content-type">What do you want to write?</label>
                    <div class="select-wrapper">
                        <select id="content-type" class="form-control glass-input">
                            <option value="Professional Email">Professional Email</option>
                            <option value="Blog Introduction">Blog Introduction</option>
                            <option value="Product Description">Product Description</option>
                            <option value="Instagram Caption">Instagram Caption</option>
                            <option value="LinkedIn Post">LinkedIn Post</option>
                            <option value="Tweet/X Post">Tweet/X Post</option>
                            <option value="Custom Content">Custom Content</option>
                        </select>
                        <i class='bx bx-chevron-down select-icon'></i>
                    </div>
                </div>

                <div class="form-group">
                    <label>Attach an Image (Optional)</label>
                    <div class="file-upload-wrapper">
                        <input type="file" id="image-upload" class="hidden-file-input" accept="image/*">
                        <label for="image-upload" class="glass-input file-upload-label">
                            <i class='bx bx-cloud-upload'></i>
                            <span>Choose an image or drag & drop</span>
                        </label>
                    </div>
                    <div id="image-preview-container" class="image-preview-container hidden">
                        <img id="image-preview" src="" alt="Selected image">
                        <button id="remove-image-btn" class="icon-btn danger-btn" aria-label="Remove image">
                            <i class='bx bx-x'></i>
                        </button>
                    </div>
                </div>

                <div class="form-group">
                    <label for="prompt">What should it be about?</label>
                    <textarea id="prompt" class="form-control glass-input" rows="7" placeholder="E.g., An email to my boss asking for next week off for a family vacation..."></textarea>
                </div>

                <button id="generate-btn" class="primary-btn glow-effect">
                    <i class='bx bx-magic-wand'></i>
                    <span>Generate Magic</span>
                </button>
                <div id="error-message" class="error-text hidden"></div>
            </section>

            <!-- Output Section -->
            <section class="glass-card output-section">
                <div class="output-header">
                    <div class="card-header">
                        <i class='bx bx-sparkles'></i>
                        <h3>Result</h3>
                    </div>
                    <div class="action-buttons">
                        <button id="copy-btn" class="icon-btn tooltip glass-btn" data-tooltip="Copy" disabled>
                            <i class='bx bx-copy'></i>
                        </button>
                        <button id="download-btn" class="icon-btn tooltip glass-btn" data-tooltip="Download TXT" disabled>
                            <i class='bx bx-download'></i>
                        </button>
                        <button id="clear-btn" class="icon-btn tooltip glass-btn" data-tooltip="Clear" disabled>
                            <i class='bx bx-trash'></i>
                        </button>
                    </div>
                </div>

                <div class="output-container glass-input">
                    <div id="loading" class="loading-state hidden">
                        <div class="spinner-container">
                            <div class="spinner"></div>
                        </div>
                        <p class="pulse-text">Weaving your content...</p>
                    </div>
                    <div id="output-content" class="output-text">
                        <div class="placeholder-container">
                            <div class="placeholder-icon">
                                <i class='bx bx-message-square-dots'></i>
                            </div>
                            <p class="placeholder-text">Your AI-generated masterpiece will appear here.</p>
                        </div>
                    </div>
                </div>
                
                <div class="output-footer">
                    <div class="stats glass-badge">
                        <i class='bx bx-text'></i>
                        <span id="word-count">0 words</span>
                        <span class="dot">•</span>
                        <span id="char-count">0 characters</span>
                    </div>
                </div>
            </section>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
